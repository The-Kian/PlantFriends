name: Deploy Cloud Functions

# Deploys the named Cloud Functions to Firebase from a branch, tag or commit.
# Merges to main are deployed by "Deploy on merge" once CI passes; use this
# to roll back (deploy an older ref) or to try a branch.
#
# The FIREBASE_SERVICE_ACCOUNT service account needs the Firebase Admin and
# Service Account User roles in Google Cloud IAM for this (see
# functions/README.md).
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy, comma-separated"
        required: true
        default: onPlantWritten
        type: string
      ref:
        description: "Branch, tag or commit to deploy from"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-functions

jobs:
  deploy:
    name: Deploy ${{ inputs.functions }} from ${{ inputs.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: functions
        run: npm ci

      - name: Deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT secret isn't set. See functions/README.md."
            exit 1
          fi
          if ! printf '%s' "$FUNCTIONS" | grep -Eq '^[A-Za-z0-9_]+(,[A-Za-z0-9_]+)*$'; then
            echo "::error::Function names must be letters, digits or underscores, separated by commas."
            exit 1
          fi
          only=$(printf '%s' "$FUNCTIONS" | sed 's/[^,]*/functions:&/g')
          key="$RUNNER_TEMP/service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          project=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).project_id)' "$key")
          status=0
          GOOGLE_APPLICATION_CREDENTIALS="$key" npx --yes firebase-tools@latest deploy \
            --only "$only" --project "$project" --non-interactive --force || status=$?
          rm -f "$key"
          exit $status
