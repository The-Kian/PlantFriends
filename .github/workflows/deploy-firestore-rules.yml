name: Deploy Firestore rules

# Publishes firestore.rules and firestore.indexes.json to Firebase from a
# branch, tag or commit. Merges to main are deployed by "Deploy on merge" once
# CI passes; use this to try a PR's rules on a phone, or to roll back.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit whose rules to publish"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules

jobs:
  deploy:
    name: Deploy rules and indexes from ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: functions
        run: npm ci --omit=dev

      - name: Deploy
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deployFirestoreRules.js ../firestore.rules

      - name: Deploy indexes
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deployFirestoreIndexes.js ../firestore.indexes.json
