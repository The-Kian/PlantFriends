name: Deploy Firestore rules

# Publishes firestore.rules to Firebase. Runs by itself when a change to the
# rules is merged into main, and can be run by hand for a branch (for example
# to test a PR on a phone before merging it).
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit whose rules to publish"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-firestore-rules

jobs:
  deploy:
    name: Deploy rules from ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: functions
        run: npm ci --omit=dev

      - name: Deploy
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/deployFirestoreRules.js ../firestore.rules
