name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ensure reproducible installs
  CI: true

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🏥 Run Expo Doctor
        run: npx expo-doctor

      - name: 🔍 Validate dependency versions
        run: npx expo install --check

  typecheck:
    name: 🔷 Type Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🔷 Type check
        run: pnpm type-check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🧹 Lint
        run: pnpm lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🧪 Run tests
        run: pnpm test --coverage --ci

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7