name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ensure reproducible installs
  CI: true

jobs:
  validate:
    name: 🔍 Validate
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🏥 Run Expo Doctor
        run: npx expo-doctor

      - name: 🔍 Validate dependency versions
        run: npx expo install --check

  typecheck:
    name: 🔷 Type Check
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🔷 Type check
        run: pnpm type-check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🧹 Lint
        run: pnpm lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0

      - name: 🧪 Run tests
        run: pnpm exec jest --coverage --ci

      - name: 📊 Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  rules:
    name: 🔒 Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: firestore-tests/package-lock.json

      - name: ☕ Setup Java (for the emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 📥 Install
        working-directory: firestore-tests
        run: npm ci

      - name: 🔒 Run rules tests
        working-directory: firestore-tests
        run: npm test

  functions:
    name: ☁️ Functions
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: 📥 Install
        working-directory: functions
        run: npm ci

      # The unit tests run in the root Jest job with the SDKs mocked. This
      # checks the code loads against the real firebase-functions and
      # firebase-admin, so an SDK upgrade that breaks it fails here.
      - name: 🔌 Load functions with the real SDKs
        working-directory: functions
        run: node -e "const f = require('./index.js'); console.log(Object.keys(f).join(', '))"

  audit:
    name: 🛡 Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup corepack
        run: corepack enable

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 🛡 Audit functions
        working-directory: functions
        run: npm audit --audit-level=high

      - name: 🛡 Audit rules tests
        working-directory: firestore-tests
        run: npm audit --audit-level=high

      # Transitive fixes are pinned with pnpm.overrides (same major only).
      # Advisories that need a major jump are listed in
      # pnpm.auditConfig.ignoreGhsas; see docs/production-readiness-plan.md.
      - name: 🛡 Audit the app
        run: pnpm audit --audit-level high
