# Dependabot configuration for PlantFriends
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      # Group React Navigation updates
      navigation:
        patterns:
          - "@react-navigation/*"
        update-types:
          - "minor"
          - "patch"
      # Group Redux updates
      redux:
        patterns:
          - "@reduxjs/*"
          - "react-redux"
        update-types:
          - "minor"
          - "patch"
      # Group Firebase updates
      firebase:
        patterns:
          - "@react-native-firebase/*"
        update-types:
          - "minor"
          - "patch"
      # Group testing libraries
      testing:
        patterns:
          - "@testing-library/*"
          - "jest"
          - "jest-*"
          - "@types/jest"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group linting/formatting tools
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
          - "prettier"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group TypeScript updates
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Group Babel updates
      babel:
        patterns:
          - "@babel/*"
          - "babel-*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # The Expo SDK decides these versions (expo-doctor fails CI if they
    # drift), and Jest has to match jest-expo. Update them with
    # `npx expo install --fix` when moving to a new SDK patch or version.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-test-renderer"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "jest"
      - dependency-name: "babel-jest"
      - dependency-name: "@types/jest"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      # Group all GitHub Actions updates
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
